# ============================================================
# GLaDOS 签到 · Quantumult X 一体化配置
# 版本：v2.0.0   更新：2026-11-16
#
# 【重要：这个文件怎么用】
# 这是一个「完整配置片段」，不是「重写远程资源」。
#
#   ❌ 不要加到：设置 → 重写 → 引用
#      （QX 的重写资源解析器只认 [rewrite_local] 里的规则行，
#        看到 [task_local] / [mitm] 段头会报「N 个问题存在于子资源」，
#        这就是你之前那个报错的成因）
#
#   ✅ 正确用法：整份内容粘贴进 QX 主配置文件
#      设置 → 配置文件 → 编辑 → 把下面三段分别合并到同名段里
#
# 【为什么 JS 和 conf 不能合成一个文件】
# QX 有两套完全独立的解析器：
#   1) 配置/重写解析器 —— 读 .conf，逐行匹配 ^... url ... 语法
#   2) JavaScript 引擎  —— 读 .js，执行 JS 代码
# 把 JS 代码放进 .conf，解析器会当成非法规则行逐行报错；
# 把规则行放进 .js，JS 引擎会报语法错误。
# 两者无法合并，这是 QX 的架构限制，不是写法问题。
#
# 但 QX 的「主配置文件」本身可以同时容纳三段配置 ——
# 所以「一个文件」的正确形态是：把这三段放进你自己的 QX 配置里。
#
# 【配套脚本】
# 下面规则和定时任务引用的 .js 必须已上传到 GitHub：
#   https://raw.githubusercontent.com/wenye618/qx/refs/heads/main/js/glados_qx_checkin_v190.js
# ============================================================


# ---------- 1. 抓包重写 ----------
# 挂到控制台页面 + 控制台启动/切页时必调的 API
# 覆盖 7 个域名，(\?.*)? 允许带查询参数（?t=xxx / ?days=30）
[rewrite_local]
^https://(glados\.cloud|glados\.rocks|glados\.one|glados\.vip|glados\.network|glados\.space|railgun\.info)/(console/account|console/checkin|api/user/status|api/user/points|api/user/iqi|api/user/checkin/challenge)(\?.*)?$ url script-request-header https://raw.githubusercontent.com/wenye618/qx/refs/heads/main/js/glados_qx_checkin_v190.js


# ---------- 2. 定时签到 ----------
# 每天北京时间 00:05 执行
[task_local]
5 0 * * * https://raw.githubusercontent.com/wenye618/qx/refs/heads/main/js/glados_qx_checkin_v190.js, tag=GLaDOS 签到, enabled=true


# ---------- 3. MITM 主机名 ----------
# 没有这段 QX 不会解密 HTTPS，rewrite 规则形同虚设
[mitm]
hostname = %APPEND% glados.cloud, glados.rocks, glados.one, glados.vip, glados.network, glados.space, railgun.info
